# Narciso Material de Construção — site estático sem build
[build]
  publish = "."

[[redirects]]
  from = "http://narcisomaterial.netlify.app/*"
  to = "https://narcisomaterial.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://narcisomaterial.netlify.app/*"
  to = "https://narcisomaterial.com.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
